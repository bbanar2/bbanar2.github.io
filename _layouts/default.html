---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body ontouchstart="">

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

    <script>
      // Custom disclosure (button + panel) instead of native <details>, which
      // has an iOS Safari reload quirk requiring two taps. A button toggles
      // reliably on a single tap on every load/reload.
      document.querySelectorAll('.disclosure').forEach(function (btn) {
        var panel = document.getElementById(btn.getAttribute('aria-controls'));
        btn.addEventListener('click', function () {
          var isOpen = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!isOpen));
          if (panel) panel.hidden = isOpen;
        });
      });
    </script>

  </body>
</html>
