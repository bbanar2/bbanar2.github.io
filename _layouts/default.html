---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body ontouchstart="">

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

    <script>
      // iOS Safari can require two taps to toggle native <details>.
      // Take over the toggle on click so the first tap works; the [open]
      // attribute still drives all the CSS animations unchanged.
      document.querySelectorAll('details > summary').forEach(function (summary) {
        summary.addEventListener('click', function (e) {
          e.preventDefault();
          var d = summary.parentNode;
          d.open = !d.open;
        });
      });
    </script>

  </body>
</html>
