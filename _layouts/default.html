{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

    <script>
      // Fix iOS Safari requiring two taps to open <details>: toggle on touchend
      document.querySelectorAll('details > summary').forEach(function (summary) {
        var moved = false;
        summary.addEventListener('touchstart', function () { moved = false; }, { passive: true });
        summary.addEventListener('touchmove', function () { moved = true; }, { passive: true });
        summary.addEventListener('touchend', function (e) {
          if (moved) return;            // ignore taps that were actually scrolls
          e.preventDefault();           // stop the synthesized click (prevents double-toggle)
          var details = summary.parentNode;
          details.open = !details.open;
        });
      });
    </script>

  </body>
</html>
