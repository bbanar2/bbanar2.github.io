---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body ontouchstart="">

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

    <script>
      // iOS Safari eats the first `click` after some page loads/reloads, so a
      // native <details> needs two taps. `touchend` always fires on the first
      // tap, so we toggle on that for touch and on `click` for mouse. A flag
      // stops the synthesized click from double-toggling. The [open] attribute
      // still drives all the CSS animations unchanged.
      document.querySelectorAll('details > summary').forEach(function (summary) {
        var details = summary.parentNode;
        var moved = false;
        var justToggled = false;

        function toggle() {
          details.open = !details.open;
        }

        summary.addEventListener('touchstart', function () { moved = false; }, { passive: true });
        summary.addEventListener('touchmove', function () { moved = true; }, { passive: true });
        summary.addEventListener('touchend', function (e) {
          if (moved) return;            // it was a scroll, not a tap
          e.preventDefault();           // suppress the synthesized click
          toggle();
          justToggled = true;
          setTimeout(function () { justToggled = false; }, 400);
        });
        summary.addEventListener('click', function (e) {
          e.preventDefault();           // cancel the finicky native toggle
          if (justToggled) return;      // touchend already handled this tap
          toggle();
        });
      });
    </script>

  </body>
</html>
